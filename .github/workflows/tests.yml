name: Tests

# Läuft bei jedem Push und bei jedem Pull Request. Die Sammlung hat einen
# konkreten Anlass: mehrere Fehler dieser App waren Wiedergänger – eine Zahl,
# die nicht zur Liste darunter passte; ein Fenster, das hinter der Kopfzeile
# lag; eine Datei, die im Offline-Cache fehlte. Geprüft wurde jedes Mal von
# Hand, und beim nächsten Mal fiel es wieder niemandem auf.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Beide Aufträge auf fester Ubuntu-Version: ubuntu-latest wechselt ab dem
# 19.10.2026 auf 26.04, und die Browser-Tests hängen an Playwright und
# dessen Systempaketen. Den Wechsel bewusst machen, nicht nebenbei. Die
# übrigen Workflows folgen dem.
#
# Gescheiterte Tests meldet zusätzlich tests/werkzeug/github-anmerkungen.mjs
# als Anmerkung am Lauf – die ist ohne Anmeldung lesbar, das Protokoll nicht.

jobs:
  # Schnell und ohne Abhängigkeiten: Node bringt den Testläufer selbst mit.
  # Läuft in unter einer Sekunde und deckt die Datenmodule und den Zustand des
  # Projekts ab.
  einheiten:
    name: Module und Projektprüfungen
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      # Mit Historie, sonst kann der Versions-Wächter darunter nichts
      # vergleichen: ein flacher Klon kennt den Vorgänger-Commit nicht.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Unit-Tests und Prüfungen
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/werkzeug/github-anmerkungen.mjs --test-reporter-destination=stdout "tests/unit/*.test.js" "tests/checks/*.test.js"

      # Nur auf main: die Version benennt den App-Shell-Cache, und wer sie
      # stehen lässt, lässt allen installierten Nutzern offline ihre alte
      # Shell. Auf einem Zweig wäre die Meldung verfrüht.
      #
      # github.event.before ist bei einem erzwungenen oder allerersten Push
      # lauter Nullen; dann gibt es nichts zu vergleichen.
      - name: Version erhöht?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        run: node tests/werkzeug/version-pruefen.mjs "${{ github.event.before }}" "${{ github.sha }}"

  # Getrennter Auftrag: der Browser braucht gut eine Minute zum Einrichten,
  # und ein Fehler in einem Datenmodul soll nicht erst danach sichtbar werden.
  browser:
    name: Oberfläche im Browser
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Die package.json liegt in tests/browser/, nicht im Wurzelverzeichnis –
      # eine neben der index.html würde Vercel dazu bringen, das Projekt als
      # Node-Anwendung zu behandeln statt als statische Seite.
      - name: Playwright einrichten
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Der Testlauf startet im Wurzelverzeichnis; umgebung.js sucht
      # Playwright deshalb ausdrücklich in tests/browser/node_modules.
      # NODE_PATH hülfe hier nicht – ESM-Importe beachten es nicht.
      - name: Browser-Tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/werkzeug/github-anmerkungen.mjs --test-reporter-destination=stdout "tests/browser/*.test.js"
