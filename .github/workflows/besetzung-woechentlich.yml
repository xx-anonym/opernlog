name: Besetzung wöchentlich lesen

# Dirigat, Regie und Besetzung je Vorstellung (Beta, seit 23.11.2026) – für
# den Vorschlag beim Loggen (src/data/hausBesetzung.js). Die Oper Leipzig und
# die Semperoper: tests/werkzeug/besetzung-lesen.mjs liest sie und schreibt
# daten/besetzung/<haus>.json. Antwortet ein Haus nicht, behält es seine alte
# Datei, die anderen werden trotzdem geschrieben.
#
# Anders als die übrigen Läufe meldet dieser nicht nur, er schreibt die Datei
# selbst ins Repo (Jonas, 23.11.2026): Umbesetzungen und neue Termine sollen
# ohne Handgriff ankommen. Er rührt nichts anderes an. Vorher prüft er die
# Datei mit tests/unit/hausBesetzung.test.js; scheitert das, bleibt alles,
# wie es war, und der Lauf wird rot.
#
# Ein Commit über den GITHUB_TOKEN stößt keine weiteren Läufe an; Vercel
# veröffentlicht ihn trotzdem.

on:
  schedule:
    # Montags 03:30 UTC – nachts, nach dem Wochenende mit den meisten Vorstellungen.
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: besetzung-lauf
  cancel-in-progress: false

jobs:
  lesen:
    # Fest statt ubuntu-latest, siehe tests.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write

    env:
      # "Heute" ist der Tag in Deutschland.
      TZ: Europe/Berlin

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Besetzung lesen
        # Auch wenn ein Haus scheitert: was gelesen ist, soll ins Repo.
        continue-on-error: true
        run: node tests/werkzeug/besetzung-lesen.mjs

      - name: Datei prüfen
        run: node --test tests/unit/hausBesetzung.test.js

      - name: Ins Repo schreiben
        run: |
          # status statt diff: auch eine neue Datei (ein neues Haus) zählt.
          if [ -z "$(git status --porcelain -- daten/besetzung)" ]; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add daten/besetzung
          git commit -m "Besetzung aus den Spielplänen aktualisiert" -m "Wöchentlicher Lauf von tests/werkzeug/besetzung-lesen.mjs."
          # Ist main inzwischen weiter, die eigene Änderung oben draufsetzen.
          git pull --rebase origin main
          git push origin HEAD:main
