name: Katalog prüfen

# Die Bilder des Katalogs liegen bei Wikimedia. Sie können dort umbenannt oder
# gelöscht werden, ohne dass hier jemand etwas davon merkt – im Katalog steht
# dann eine tote Adresse, und in der App bleibt die Kachel beim farbigen
# Verlauf. Das fällt niemandem auf, weil es nicht kaputt aussieht.
#
# Deshalb eine eigene Prüfung. Nicht bei jedem Push: sie schickt 175 Anfragen
# nach außen und sagt nichts über den Code aus, der gerade geändert wurde.
# Einmal in der Woche reicht, und bei Bedarf von Hand.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      modus:
        description: 'pruefen = Bildadressen testen, suche = Bilder finden, daten = Plätze und Gründungsjahre gegen Wikidata halten'
        type: choice
        options: [pruefen, suche, daten]
        default: pruefen
  # Bei Änderungen am Katalog sofort: dort entstehen die Adressen.
  push:
    paths:
      - 'src/data/operas.js'
      - 'src/data/operaHouses.js'
      - 'tests/werkzeug/bilder-pruefen.mjs'

jobs:
  bilder:
    name: Katalogdaten von außen
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Jede Adresse einmal anfragen
        if: inputs.modus != 'suche'
        run: node tests/werkzeug/bilder-pruefen.mjs

      # Für neue Katalogeinträge: Dateinamen lassen sich nicht raten, die
      # Adresse dahinter dann aber berechnen. Siehe tests/werkzeug/commons.mjs.
      - name: Bilder für neue Einträge suchen
        if: inputs.modus == 'suche'
        run: node tests/werkzeug/commons-suche.mjs tests/werkzeug/suche.json

      # Sitzplatzzahl und Gründungsjahr stehen im Katalog von Hand. Wikidata
      # führt beides strukturiert – der Abgleich stellt gegenüber, entscheidet
      # aber nichts: bei einem Mehrspartenhaus meint eine Zahl mal das Große
      # Haus, mal das ganze Theater.
      - name: Plätze und Gründungsjahre gegen Wikidata halten
        if: inputs.modus == 'daten'
        run: node tests/werkzeug/daten-pruefen.mjs Österreich
