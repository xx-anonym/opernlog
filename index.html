<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>OpernLog – Dein Operntagebuch</title>
    <meta name="description"
        content="OpernLog – Logge, bewerte und teile deine Opernbesuche in deutschen Opernhäusern. Wie Letterboxd, nur für Oper." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#8b1a2b" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpernLog" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Favicons: SVG for modern browsers, PNG fallbacks. The 16px variant
         drops to a single mask – two overlapping ones turn to mud at that size. -->
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />

    <!-- Prevent iOS zoom on input focus -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <!-- Splash styles are inlined so the first paint already shows the curtain.
         As a separate stylesheet they had to wait for a ~90KB render-blocking
         request, and until then the browser painted nothing. -->
    <style>
        html {
            /* Canvas colour from the very first frame – body's near-black would
               otherwise propagate here and read as a black flash. */
            background: #3d0a15;
        }

        /* ============================================
           OpernLog – Splash Screen (Opera Curtain)
           Loaded FIRST for instant display
           ============================================ */

        .splash {
            --splash-bg: #0a0c0f;
            --splash-gold: #c9a84c;
            --splash-gold-lit: #f0dc9a;

            position: fixed;
            inset: 0;
            z-index: 9999;
            background:
                radial-gradient(ellipse 90% 60% at 50% 42%, #14181c 0%, #0a0c0f 70%),
                var(--splash-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Fade starts AFTER curtains are mostly open (0.7s delay, then 0.4s fade) */
            transition: opacity 0.4s ease 0.7s, visibility 0s ease 1.1s;
        }

        .splash.splash--hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ── Stage light – sits ON the curtains, so it is visible while waiting ── */
        .splash__stage {
            position: absolute;
            inset: 0;
            z-index: 3;
            overflow: hidden;
            pointer-events: none;
        }

        /* Spotlight cone from above, slowly swaying */
        .splash__spotlight {
            position: absolute;
            top: -12%;
            left: 50%;
            width: 460px;
            height: 640px;
            margin-left: -230px;
            background: linear-gradient(180deg,
                    rgba(255, 240, 200, 0.16) 0%,
                    rgba(255, 235, 190, 0.07) 35%,
                    rgba(255, 235, 190, 0.025) 65%,
                    transparent 100%);
            /* Narrow at the top, wide at the bottom – a real beam */
            clip-path: polygon(43% 0%, 57% 0%, 96% 100%, 4% 100%);
            filter: blur(22px);
            -webkit-mask-image: radial-gradient(ellipse 70% 85% at 50% 15%, #000 35%, transparent 100%);
            mask-image: radial-gradient(ellipse 70% 85% at 50% 15%, #000 35%, transparent 100%);
            mix-blend-mode: screen;
            transform-origin: 50% 0%;
            animation: splashBeam 7s ease-in-out infinite;
        }

        @keyframes splashBeam {

            0%,
            100% {
                transform: rotate(-2.2deg) scaleY(1);
                opacity: 0.75;
            }

            50% {
                transform: rotate(2.2deg) scaleY(1.04);
                opacity: 1;
            }
        }

        /* Dust motes drifting up through the beam */
        .splash__motes {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 520px;
            height: 100%;
            margin-left: -260px;
        }

        .splash__mote {
            position: absolute;
            bottom: -10px;
            /* offset via left – a percentage transform would resolve against the 3px dot */
            left: calc(50% + var(--x, 0px));
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--splash-gold);
            opacity: 0;
            animation: splashMote var(--d, 8s) linear infinite;
            animation-delay: calc(var(--i) * -1.15s);
        }

        @keyframes splashMote {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0;
            }

            15% {
                opacity: 0.6;
            }

            70% {
                opacity: 0.4;
            }

            100% {
                transform: translate(var(--drift, 20px), -80vh) scale(1);
                opacity: 0;
            }
        }

        /* Warm footlight glow along the stage floor */
        .splash__footlights {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 160px;
            background: radial-gradient(ellipse 70% 100% at 50% 100%,
                    rgba(255, 226, 160, 0.18) 0%,
                    rgba(255, 190, 120, 0.07) 45%,
                    transparent 75%);
            mix-blend-mode: screen;
            animation: splashFootlights 4.5s ease-in-out infinite;
        }

        @keyframes splashFootlights {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        /* ── Velvet curtains ─────────────────────────────────── */
        .splash__curtain {
            position: absolute;
            top: -10%;
            width: 55%;
            height: 120%;
            z-index: 2;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            background:
                /* soft vertical folds */
                repeating-linear-gradient(90deg,
                    rgba(255, 255, 255, 0.055) 0px,
                    rgba(0, 0, 0, 0.10) 9px,
                    rgba(0, 0, 0, 0.26) 19px,
                    rgba(0, 0, 0, 0.10) 29px,
                    rgba(255, 255, 255, 0.055) 38px),
                /* fine weave */
                repeating-linear-gradient(90deg,
                    rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0.05) 2px,
                    rgba(0, 0, 0, 0) 4px),
                linear-gradient(180deg,
                    #3d0a15 0%, #6b1525 15%, #8b1a2b 30%,
                    #7a1826 50%, #8b1a2b 65%, #6b1525 85%, #3d0a15 100%);
            box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.55);
            animation: splashCurtainBreathe 6s ease-in-out infinite;
        }

        .splash__curtain--left {
            left: 0;
            border-right: 3px solid #4a0e1a;
            transform-origin: left center;
        }

        .splash__curtain--right {
            right: 0;
            border-left: 3px solid #4a0e1a;
            transform-origin: right center;
            animation-delay: -3s;
        }

        /* Barely-there shimmer so the fabric feels alive while waiting.
           Deliberately NOT on transform – that property belongs to the opening
           transition, and an animation on it would override the slide. */
        @keyframes splashCurtainBreathe {

            0%,
            100% {
                filter: brightness(1) saturate(1);
            }

            50% {
                filter: brightness(1.08) saturate(1.05);
            }
        }

        /* Curtains part when app is ready */
        .splash--hidden .splash__curtain {
            animation: none;
        }

        .splash--hidden .splash__curtain--left {
            transform: translateX(-105%);
        }

        .splash--hidden .splash__curtain--right {
            transform: translateX(105%);
        }

        /* Pelmet across the top, with a scalloped hem and gold trim */
        .splash__valance {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 72px;
            z-index: 4;
            background:
                repeating-linear-gradient(90deg,
                    rgba(255, 255, 255, 0.05) 0px,
                    rgba(0, 0, 0, 0.14) 11px,
                    rgba(0, 0, 0, 0.24) 22px,
                    rgba(255, 255, 255, 0.05) 34px),
                linear-gradient(180deg, #8b1a2b 0%, #6b1525 60%, #4a0e1a 100%);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
            border-bottom: 2px solid rgba(201, 168, 76, 0.4);
            mask-repeat: repeat-x;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash__valance::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            height: 9px;
            background:
                repeating-linear-gradient(90deg,
                    rgba(201, 168, 76, 0.55) 0 1.5px,
                    transparent 1.5px 7px);
            -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
        }

        .splash--hidden .splash__valance {
            transform: translateY(-100%);
        }

        /* ── Center content ──────────────────────────────────── */
        .splash__content {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 0 24px;
            animation: splashFadeUp 0.8s ease-out 0.15s both;
        }

        /* Content clears the stage first, then the curtains open.
           This has to be a second animation: the intro animation's "both" fill mode
           keeps opacity:1 applied and would win over a plain declaration. */
        .splash--hidden .splash__content {
            animation: splashContentOut 0.3s ease forwards;
        }

        @keyframes splashContentOut {
            to {
                opacity: 0;
                transform: translateY(-10px) scale(0.98);
            }
        }

        @keyframes splashFadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash__logo {
            width: 122px;
            height: 106px;
            margin: 0 auto 20px;
            color: var(--splash-gold);
            animation: splashLogoFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(201, 168, 76, 0.35));
        }

        .splash__logo svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes splashLogoFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-1.2deg);
                filter: drop-shadow(0 0 14px rgba(201, 168, 76, 0.28));
            }

            50% {
                transform: translateY(-7px) rotate(1.2deg);
                filter: drop-shadow(0 0 26px rgba(201, 168, 76, 0.5));
            }
        }

        .splash__title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 46px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 3px;
            display: flex;
            justify-content: center;
            /* Lifts the gold off the red velvet */
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.65));
        }

        /* Each letter carries its own gradient so the shimmer can travel across the word */
        .splash__title span {
            display: inline-block;
            background: linear-gradient(115deg,
                    #9c7f2e 0%,
                    var(--splash-gold) 35%,
                    var(--splash-gold-lit) 50%,
                    var(--splash-gold) 65%,
                    #9c7f2e 100%);
            background-size: 320% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation:
                splashLetterIn 0.55s cubic-bezier(0.2, 0.85, 0.25, 1) both,
                splashShimmer 3.6s ease-in-out infinite;
            animation-delay:
                calc(0.18s + var(--i) * 0.045s),
                calc(0.7s + var(--i) * 0.045s);
        }

        @keyframes splashLetterIn {
            from {
                opacity: 0;
                transform: translateY(26px) rotate(6deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes splashShimmer {

            0%,
            100% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 0% 50%;
            }
        }

        .splash__subtitle {
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: rgba(232, 224, 210, 0.78);
            letter-spacing: 0.6px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
            margin-bottom: 26px;
            animation: splashFadeUp 0.5s ease-out 0.38s both;
        }

        /* Indeterminate loading sweep – no fake percentage, just motion */
        .splash__progress {
            position: relative;
            width: 190px;
            height: 3px;
            margin: 0 auto;
            border-radius: 2px;
            overflow: hidden;
            background: rgba(201, 168, 76, 0.18);
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
            animation: splashFadeUp 0.5s ease-out 0.6s both;
        }

        .splash__progress::after {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: 42%;
            border-radius: 2px;
            background: linear-gradient(90deg,
                    transparent,
                    var(--splash-gold) 45%,
                    var(--splash-gold-lit) 55%,
                    transparent);
            animation: splashSweep 1.5s cubic-bezier(0.55, 0, 0.45, 1) 0.6s infinite;
        }

        @keyframes splashSweep {
            0% {
                transform: translateX(-110%);
            }

            100% {
                transform: translateX(348%);
            }
        }

        @media (max-width: 420px) {
            .splash__logo {
                width: 76px;
                height: 76px;
            }

            .splash__title {
                font-size: 36px;
                letter-spacing: 2px;
            }

            .splash__spotlight {
                width: 340px;
                margin-left: -170px;
            }
        }

        /* Respect users who ask for less motion: keep the reveal, drop the looping */
        @media (prefers-reduced-motion: reduce) {

            .splash__spotlight,
            .splash__mote,
            .splash__footlights,
            .splash__curtain,
            .splash__logo,
            .splash__title span,
            .splash__progress::after {
                animation: none !important;
            }

            .splash__mote {
                opacity: 0;
            }

            .splash__title span {
                opacity: 1;
                transform: none;
            }

            .splash__progress::after {
                transform: translateX(0);
                width: 100%;
                opacity: 0.5;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css" />
    <!-- Aus dem Projekt, nicht vom CDN: der Service Worker überspringt fremde
         Hosts, die Bibliothek lag also in keinem Cache. Ohne Netz war
         window.supabase undefined und die App startete gar nicht.
         Siehe den Kopf von vendor/supabase-js.js. -->
    <script src="vendor/supabase-js.js"></script>
</head>

<body>
    <!-- Splash Screen – Animated Opera Curtain -->
    <div id="splash" class="splash" role="status" aria-label="OpernLog wird geladen">
        <!-- Stage behind the curtains -->
        <div class="splash__stage" aria-hidden="true">
            <div class="splash__spotlight"></div>
            <div class="splash__motes">
                <span class="splash__mote" style="--i:0;--x:-210px;--drift:-34px;--d:7.5s"></span>
                <span class="splash__mote" style="--i:1;--x:120px;--drift:26px;--d:9s"></span>
                <span class="splash__mote" style="--i:2;--x:-70px;--drift:18px;--d:6.5s"></span>
                <span class="splash__mote" style="--i:3;--x:215px;--drift:-30px;--d:8.5s"></span>
                <span class="splash__mote" style="--i:4;--x:-155px;--drift:22px;--d:10s"></span>
                <span class="splash__mote" style="--i:5;--x:45px;--drift:-24px;--d:7s"></span>
                <span class="splash__mote" style="--i:6;--x:175px;--drift:32px;--d:9.5s"></span>
                <span class="splash__mote" style="--i:7;--x:-240px;--drift:28px;--d:8s"></span>
            </div>
            <div class="splash__footlights"></div>
        </div>

        <!-- Velvet curtains -->
        <div class="splash__curtain splash__curtain--left" aria-hidden="true"></div>
        <div class="splash__curtain splash__curtain--right" aria-hidden="true"></div>
        <div class="splash__valance" aria-hidden="true"></div>

        <div class="splash__content">
            <div class="splash__logo" aria-hidden="true">
                <svg viewBox="11 13 46 40" fill="none" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round">
                    <!-- Tragedy mask (behind, right) -->
                    <path d="M32 26C32 16 54 16 54 26C54 37 49 44 43 44C37 44 32 37 32 26Z"
                        fill="#2a0d15" />
                    <path d="M40 26.5Q42.5 29.5 45 26.5" stroke-width="1.1" />
                    <path d="M47.5 26.5Q50 29.5 52.5 26.5" stroke-width="1.1" />
                    <path d="M41 38Q46 33.5 51 38" stroke-width="1.1" />
                    <!-- Comedy mask (front, left) – opaque, so it occludes the one behind -->
                    <path d="M14 30C14 19 38 19 38 30C38 42 33 50 26 50C19 50 14 42 14 30Z"
                        fill="#1a0710" />
                    <path d="M19.5 30.5Q22 27.5 24.5 30.5" stroke-width="1.1" />
                    <path d="M27.5 30.5Q30 27.5 32.5 30.5" stroke-width="1.1" />
                    <path d="M19.5 38Q26 44 32.5 38" stroke-width="1.1" />
                </svg>
            </div>
            <h1 class="splash__title" aria-label="OpernLog"><span aria-hidden="true"
                    style="--i:0">O</span><span aria-hidden="true" style="--i:1">p</span><span aria-hidden="true"
                    style="--i:2">e</span><span aria-hidden="true" style="--i:3">r</span><span aria-hidden="true"
                    style="--i:4">n</span><span aria-hidden="true" style="--i:5">L</span><span aria-hidden="true"
                    style="--i:6">o</span><span aria-hidden="true" style="--i:7">g</span></h1>
            <p class="splash__subtitle">Dein persönliches Operntagebuch</p>
            <div class="splash__progress" aria-hidden="true"></div>
        </div>
    </div>

    <div id="app"></div>
    <script type="module" src="src/main.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
                    .catch(err => console.warn('[PWA] SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
